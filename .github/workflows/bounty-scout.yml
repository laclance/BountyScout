name: OSS Opportunity Scout Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Seen Bounties State
        run: |
          git fetch origin scout-state
          git show origin/scout-state:seen_bounties.json > seen_bounties.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run OSS Opportunity Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python opportunity_scout.py

      - name: Commit & Push Updated Seen Bounties State
        run: |
          cp seen_bounties.json /tmp/seen_bounties.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git worktree add --detach /tmp/scout-state origin/scout-state
          cp /tmp/seen_bounties.json /tmp/scout-state/seen_bounties.json
          cd /tmp/scout-state
          git add seen_bounties.json
          git diff --staged --quiet || (
            git commit -m "chore: update seen bounties state [skip ci]" &&
            git push origin HEAD:scout-state
          )
