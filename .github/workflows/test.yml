name: Test OSS Opportunity Scout

on:
  pull_request:
    paths:
      - "scout_bounties.py"
      - "opportunity_scout.py"
      - "test_opportunity_scout.py"
      - "test_scout_bounties.py"
      - ".coveragerc"
      - "test_scout_bounties.py"
      - ".coveragerc"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "scout_bounties.py"
      - "opportunity_scout.py"
      - "test_opportunity_scout.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install coverage
      - run: python -m py_compile scout_bounties.py opportunity_scout.py test_scout_bounties.py test_opportunity_scout.py
      - run: coverage run --branch -m unittest -v
      - run: coverage report
