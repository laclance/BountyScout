name: Test OSS Opportunity Scout

on:
  pull_request:
    paths:
      - "scout_bounties.py"
      - "opportunity_scout.py"
      - "test_opportunity_scout.py"
      - "test_scout_bounties.py"
      - ".coveragerc"
      - "mypy.ini"
      - "ruff.toml"
      - ".github/workflows/ruff-format.yml"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "scout_bounties.py"
      - "opportunity_scout.py"
      - "test_opportunity_scout.py"
      - "test_scout_bounties.py"
      - ".coveragerc"
      - "mypy.ini"
      - "ruff.toml"
      - ".github/workflows/ruff-format.yml"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install coverage mypy ruff==0.16.9

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python
        run: python -m py_compile scout_bounties.py opportunity_scout.py test_scout_bounties.py test_opportunity_scout.py

      - name: Type check with mypy
        run: mypy

      - name: Run tests with branch coverage
        run: coverage run --branch -m unittest -v

      - name: Enforce coverage
        run: coverage report
