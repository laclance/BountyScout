name: Ruff Autoformat

on:
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.py"
      - "ruff.toml"
      - ".github/workflows/ruff-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.9

      - name: Format Python
        run: ruff format .

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Ruff formatting already clean."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- '*.py' '**/*.py'
          git commit -m "style: auto-format with Ruff [skip ci]"
          git push
