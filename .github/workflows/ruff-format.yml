name: Branch Autoformat & Validate

on:
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.py"
      - ".coveragerc"
      - "mypy.ini"
      - "ruff.toml"
      - ".github/workflows/*.yml"

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install coverage mypy ruff==0.16.9

      - name: Format with Ruff
        run: ruff format .

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Ruff formatting already clean."
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -- '*.py' '**/*.py'
            git commit -m "style: auto-format with Ruff [skip ci]"
            git push
          fi

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python
        run: python -m py_compile scout_bounties.py opportunity_scout.py test_scout_bounties.py test_opportunity_scout.py

      - name: Type check with mypy
        run: mypy

      - name: Run tests with branch coverage
        run: coverage run --branch -m unittest -v

      - name: Enforce coverage
        run: coverage report
